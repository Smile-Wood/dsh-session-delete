# Example: mount this plugin from a checkout, without installing it into the
# profile.
#
# Drop this file at  $DSH_HOME/cordis.patch.yml  (that is
# %USERPROFILE%\.dsh\cordis.patch.yml on Windows) and edit the `name` below to
# the absolute path of host.js in your checkout.
#
# Why this works, and why the path is absolute:
#
#   * $DSH_HOME/cordis.patch.yml is a machine-wide patch layer that the HMR
#     plugin watches live. Saving the file recomposes the Loader immediately --
#     no restart, no `pnpm install`.
#   * A `name` that is absolute (or starts with `./` / `../`) is rewritten to a
#     `file://` URL by the boot layer.
#   * Node's ESM registry caches modules by resolved URL and has no
#     invalidation hook. A fresh URL therefore means a fresh module generation,
#     which is how you reload edited Host code in a running DSH.
#
# That last point cuts both ways: editing host.js in place will NOT be picked
# up. To load a changed Host half you must either restart DSH, or bump the
# filename (host.js -> host.v7.js) and update the `name` below to match.

# Retire any earlier generation still listed here. A route table entry can
# outlive the fiber that registered it, so leaving an old row enabled keeps a
# stale route (and a duplicate-path error) alive.
# - id: session-delete
#   disabled: true

- insert:
    - id: session-delete
      name: 'C:/Users/you/code/dsh-session-delete/host.js'